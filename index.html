<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSC Motor Health Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="top-controls">
    <button onclick="startMonitoring()">CONNECT SYSTEM</button>
    <button onclick="stopMonitoring()">DISCONNECT</button>
</div>

<div class="container">

    <div class="header">
        <h2>PSC MOTOR MONITORING</h2>
        <div id="sync-status">OFFLINE</div>
    </div>

    <!-- ================= DATA CARDS ================= -->
    <div class="metrics-grid">

        <div class="card">
            <div class="label">Temperature</div>
            <div class="value">
                <span id="temp-display">--</span> °C
            </div>
        </div>

        <div class="card">
            <div class="label">Vibration</div>
            <div class="value">
                <span id="vib-display">--</span> G
            </div>
        </div>

    </div>

    <!-- ================= CONDITION ================= -->
    <div class="ai-box">

        <div id="status-label">SYSTEM INITIALIZING</div>

        <div id="ai-action-step">
            Waiting for FPGA + sensor data...
        </div>

        <div>
            Condition Assessment:
            <b id="motor-health-score">WAITING</b>
        </div>

    </div>

    <!-- ================= CHART ================= -->
    <canvas id="myChart"></canvas>

    <!-- ================= LOG ================= -->
    <div id="system-logs"></div>

</div>

<script src="script.js"></script>
</body>
</html>
